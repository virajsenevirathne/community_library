name: Backup

# A weekly copy of the live database, encrypted, kept for 30 days as a
# workflow artifact. It covers what D1 Time Travel can't: losing the
# Cloudflare account or the database itself. See docs/backups.md.
#
# Turned off until the repository variable BACKUP_ENABLED is "true" and these
# secrets exist: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, BACKUP_PASSPHRASE.
on:
  schedule:
    - cron: "0 15 * * 0" # Sundays, 15:00 UTC (early Monday in Australia)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    if: vars.BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Secrets are given only to the steps that need them, never to installing
    # dependencies.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the passphrase is set
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ "${#BACKUP_PASSPHRASE}" -lt 32 ]; then
            echo "::error::BACKUP_PASSPHRASE must be a random string of at least 32 characters (openssl rand -base64 32)."
            exit 1
          fi
      - name: Export the database
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # Structure first, then the rows: a single export puts each table's
        # rows right after it, before the tables they point at exist, and
        # then can't be loaded back.
        run: |
          npx wrangler d1 export DB --remote --no-data --output "$RUNNER_TEMP/schema.sql"
          npx wrangler d1 export DB --remote --no-schema --output "$RUNNER_TEMP/data.sql"
          cat "$RUNNER_TEMP/schema.sql" "$RUNNER_TEMP/data.sql" > "$RUNNER_TEMP/library.sql"
          rm "$RUNNER_TEMP/schema.sql" "$RUNNER_TEMP/data.sql"
          grep -q "CREATE TABLE" "$RUNNER_TEMP/library.sql"
      - name: Compress and encrypt
        # The export holds families' names and emails: it is never stored unencrypted.
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          stamp=$(date -u +%Y-%m-%d)
          gzip -9 "$RUNNER_TEMP/library.sql"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt \
            -in "$RUNNER_TEMP/library.sql.gz" -out "library-$stamp.sql.gz.enc" \
            -pass env:BACKUP_PASSPHRASE
          rm "$RUNNER_TEMP/library.sql.gz"
          echo "STAMP=$stamp" >> "$GITHUB_ENV"
      - name: Check the backup opens
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "library-$STAMP.sql.gz.enc" -pass env:BACKUP_PASSPHRASE \
            | gunzip | grep -q "CREATE TABLE"
      - uses: actions/upload-artifact@v4
        with:
          name: library-backup-${{ env.STAMP }}
          path: library-*.sql.gz.enc
          retention-days: 30
          if-no-files-found: error
